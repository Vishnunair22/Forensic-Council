name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd apps/api
          uv sync --extra dev

      - name: Run test hygiene checker
        run: python scripts/check_test_hygiene.py

      - name: Lint with ruff
        run: cd apps/api && uv run ruff check .

      - name: Type check with pyright
        run: cd apps/api && uv run pyright

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.16.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -sf http://localhost:6333/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd apps/api
          uv sync --all-extras

      - name: Generate test secrets
        run: |
          echo "SIGNING_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "LLM_API_KEY=ci-stub" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=ci-stub" >> $GITHUB_ENV

      - name: Run tests with coverage
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql://postgres:test@localhost/test
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333
        run: |
          cd apps/api
          # Exclude ML, network, and Docker tests that require extra services.
          # (P1-CI-001 fix, audit v6→v7; Phase 8.5 alignment)
          uv run pytest tests/ -v --tb=short \
            -m "not requires_ml and not requires_network and not requires_docker" \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-lint:
    name: Frontend lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Lint
        run: cd apps/web && npm run lint

      - name: Type check
        run: cd apps/web && npm run type-check

      - name: Run test hygiene checker
        run: python scripts/check_test_hygiene.py

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Run tests
        run: cd apps/web && npm run test

  frontend-a11y:
    name: Accessibility audit (axe-playwright)
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Build application
        run: cd apps/web && npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: Start server and run a11y tests
        run: |
          cd apps/web
          npm run start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          # Wait for server without requiring undeclared npx wait-on dependency.
          node - <<'NODE'
          const http = require("http");
          const deadline = Date.now() + 60_000;
          function check() {
            http.get("http://localhost:3000", (res) => {
              if (res.statusCode && res.statusCode < 500) process.exit(0);
              retry();
            }).on("error", retry);
          }
          function retry() {
            if (Date.now() > deadline) {
              console.error("Timed out waiting for http://localhost:3000");
              process.exit(1);
            }
            setTimeout(check, 1000);
          }
          check();
          NODE
          npm run test:a11y
        env:
          PORT: 3000

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Build
        run: cd apps/web && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          # Block CI on CRITICAL/HIGH fixed vulns. ignore-unfixed avoids noise from
          # upstream deps with no available fix. (P1-CI-002 fix, audit v6→v7)
          exit-code: "1"
          ignore-unfixed: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-test
      - frontend-build
      - frontend-a11y
      - security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker buildx build \
            --target production \
            --cache-from type=gha,scope=backend-production \
            --cache-to   type=gha,scope=backend-production,mode=max \
            -t forensic-council-backend:test \
            --build-arg PRELOAD_MODELS=0 \
            apps/api/

      - name: Build backend migration image
        run: |
          docker buildx build \
            --target migration \
            --cache-from type=gha,scope=backend-migration \
            --cache-to   type=gha,scope=backend-migration,mode=max \
            -t forensic-council-migration:test \
            --build-arg PRELOAD_MODELS=0 \
            apps/api/

      - name: Build frontend image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=frontend \
            --cache-to   type=gha,scope=frontend,mode=max \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }} \
            --build-arg INTERNAL_API_URL=http://backend:8000 \
            -t forensic-council-frontend:test \
            .

      - name: Verify images exist
        run: |
          docker image inspect forensic-council-backend:test
          docker image inspect forensic-council-migration:test
          docker image inspect forensic-council-frontend:test

  nightly-ml-tests:
    name: Nightly ML tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.16.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd apps/api
          uv sync --all-extras

      - name: Generate test secrets
        run: |
          echo "SIGNING_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "LLM_API_KEY=ci-stub" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=ci-stub" >> $GITHUB_ENV

      - name: Run ML tests
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql://postgres:test@localhost/test
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333
        run: |
          cd apps/api
          uv run pytest tests/ -v --tb=short -m requires_ml
