# ============================================================================
# Forensic Council - Docker Compose Override (Development host ports)
# ============================================================================
# The standard development overlay (used by scripts/dev.sh). The base compose
# file keeps infra services internal and routes all app traffic through Caddy
# (port 80); this overlay layers direct host port bindings on top so you can:
#   • reach the backend at http://localhost:8000 (bypassing Caddy) for debugging
#   • reach the frontend at http://localhost:3000
#   • point external SQL / Redis / Qdrant clients at the containers, or run the
#     API/frontend on the host (uv/npm) against Docker-managed infrastructure
# ============================================================================

services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  qdrant:
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"

  backend:
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"

  worker:
    environment:
      # TRANSIENT (RAM-starved host): cap concurrent heavy ML subprocess executions
      # lower than the code default (4) so deep analysis fits the available memory and
      # the worker isn't OOM-killed mid-run. Restore to 4 (remove this) once the host
      # has ~6GB+ free. Tunable via ML_MAX_CONCURRENCY.
      - ML_MAX_CONCURRENCY=${ML_MAX_CONCURRENCY:-2}

  frontend:
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      # NOTE: Setting NEXT_PUBLIC_API_URL to port 8000 routes browser requests
      # directly to the backend, bypassing Caddy (no CSRF cookies, no rate limiting,
      # no security headers). This is intentional for dev convenience — CSRF-protected
      # flows (auth, demo login) must be tested through Caddy (http://localhost) not
      # the direct backend port.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}

  # ⚠️  DEV ONLY: expose observability UIs directly to the host.
  # These bindings bypass the container network security model — any process
  # on the developer's machine can reach Jaeger and Prometheus directly.
  # The prod overlay resets these to [] so they are never exposed in production.
  jaeger:
    ports:
      - "16686:16686"

  prometheus:
    ports:
      - "9090:9090"
