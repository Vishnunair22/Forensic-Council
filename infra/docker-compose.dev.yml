# ============================================================================
# Forensic Council - Docker Compose Override (Host-run development)
# ============================================================================
# Use this only when Postgres/Redis/Qdrant run in Docker but the API/frontend
# run directly on the host via uv/npm. The base compose file keeps infra
# services internal by default; this override exposes development host ports.
# ============================================================================

services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  qdrant:
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"

  backend:
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"

  frontend:
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      # NOTE: Setting NEXT_PUBLIC_API_URL to port 8000 routes browser requests
      # directly to the backend, bypassing Caddy (no CSRF cookies, no rate limiting,
      # no security headers). This is intentional for dev convenience — CSRF-protected
      # flows (auth, demo login) must be tested through Caddy (http://localhost) not
      # the direct backend port.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
