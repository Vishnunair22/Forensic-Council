# ============================================================================
# Forensic Council — Docker Compose (Development + Production base)
# ============================================================================
#
# Quick start:
#   copy .env.example .env   # then fill in LLM_API_KEY etc.
#   bash scripts/dev.sh                                  # recommended one-command boot
#   # or, manual:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml --env-file .env up --build
#
# BuildKit is enabled by default in Docker 23+ and Docker Desktop.
# If you're on an older Docker version add: DOCKER_BUILDKIT=1 before the command.
#
# ML models are stored in named volumes (hf_cache, torch_cache, etc.).
# They download ONCE on first start and persist across rebuilds/restarts.
# DO NOT use `docker compose down -v` unless you want to redownload all models.
# WARNING: `docker compose down -v` also destroys the postgres volume, permanently
# deleting the ECDSA private keys in the agent_signing_keys table (encrypted at rest
# via HKDF-derived Fernet from SIGNING_KEY). New keys are generated on next startup,
# making all previously signed report signatures unverifiable. Back up the postgres
# volume before running `down -v` if you need to preserve signature chain of custody.
#
# IMPORTANT: The Docker project name is locked to "forensic-council" via the
# `name:` directive below (NOT via COMPOSE_PROJECT_NAME, which is intentionally
# left unset). This ensures dev and production builds share the SAME named volumes
# and never re-download ML models when switching between dev and prod modes.
# ============================================================================

# Locks the Docker project name so all compose variants (dev, prod, override)
# always use the same named volume pool. Without this, Docker would prefix volumes
# differently based on the working directory, causing separate model downloads.
name: forensic-council

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  QDRANT_GRPC_PORT: 6334
  QDRANT_HTTPS: "false"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-forensic_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  POSTGRES_DB: ${POSTGRES_DB:-forensic_council}
  SIGNING_KEY: ${SIGNING_KEY:?SIGNING_KEY must be set}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ANALYSIS_EXECUTION_MODE: ${ANALYSIS_EXECUTION_MODE:-local_only}
  OFFLINE_MODE: ${OFFLINE_MODE:-true}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
  LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-llama-3.1-8b-instant}
  LLM_ENABLE_REACT_REASONING: ${LLM_ENABLE_REACT_REASONING:-false}
  LLM_ENABLE_POST_SYNTHESIS: ${LLM_ENABLE_POST_SYNTHESIS:-false}
  VISION_PROVIDER_CHAIN: ${VISION_PROVIDER_CHAIN:-local_ensemble}
  GROQ_VISION_API_KEY: ${GROQ_VISION_API_KEY:-}
  # Docker stacks use the worker queue by default (DOCKER_USE_REDIS_WORKER=true).
  # Direct `uv run` uses USE_REDIS_WORKER=false from .env for in-process mode.
  # Keep these separate so host-local defaults do not silently disable the
  # Docker worker service.
  USE_REDIS_WORKER: ${DOCKER_USE_REDIS_WORKER:-true}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.5-flash-lite,gemini-2.0-flash,gemini-2.0-flash-lite}
  GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-55.0}
  GEMINI_MAX_CONCURRENT: ${GEMINI_MAX_CONCURRENT:-2}
  # GEMINI_API_KEY_POLICY_OK must be explicitly set. No silent false default — that
  # silently disables Agents 1/3/5 deep pass when .env is partial (P0-SEC-001 fix, audit v6→v7).
  GEMINI_API_KEY_POLICY_OK: ${GEMINI_API_KEY_POLICY_OK:-false}
  DAILY_COST_QUOTA_USD: ${DAILY_COST_QUOTA_USD:-50.0}
  DAILY_COST_QUOTA_ADMIN_USD: ${DAILY_COST_QUOTA_ADMIN_USD:-500.0}
  EVIDENCE_STORAGE_PATH: /app/storage/evidence
  CALIBRATION_MODELS_PATH: /app/cache/calibration_models
  # Must be 0 — disabling numba JIT breaks all of librosa (Agent 2 audio tools).
  NUMBA_DISABLE_JIT: ${NUMBA_DISABLE_JIT:-0}
  NUMBA_CACHE_DIR: /app/cache/numba_cache
  HOME: /tmp
  EASYOCR_MODEL_DIR: /app/cache/easyocr
  YOLO_MODEL_DIR: /app/cache/ultralytics
  YOLO_MODEL_NAME: ${YOLO_MODEL_NAME:-detr-resnet-50}
  AASIST_MODEL_NAME: ${AASIST_MODEL_NAME:-Vansh180/deepfake-audio-wav2vec2}
  YOLO_CONFIG_DIR: /app/cache/ultralytics
  TORCH_HOME: /app/cache/torch
  HF_HOME: /app/cache/huggingface
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-forensic-council-api}
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?METRICS_SCRAPE_TOKEN must be set}
  # Force watchfiles to use polling mode on Windows Docker bind mounts.
  # inotify events from Windows host → WSL2 → container are unreliable;
  # polling ensures uvicorn --reload actually picks up code changes.
  WATCHFILES_FORCE_POLLING: "true"
  UV_WATCHFILES_POLL_INTERVAL_MS: "500"
  PYTHONDONTWRITEBYTECODE: "1"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:8000}
  # Cap ML process pool workers to 2 in Docker dev to avoid OOM when both
  # backend and worker run simultaneous pools on the right-sized mem budget
  # (backend 2.5g / worker 6g; see the per-service mem_limit settings below).
  # Set to 0 in .env to restore auto (min(4, cpu_count)) for bare-metal.
  FORENSIC_MAX_WORKERS: ${FORENSIC_MAX_WORKERS:-2}
  ENABLE_AUDIO_MODELS: ${ENABLE_AUDIO_MODELS:-false}
  ENABLE_VIDEO_MODELS: ${ENABLE_VIDEO_MODELS:-false}
  # Non-commercial research models (TruFor splicing localization, etc.). Default
  # off; enabled for this academic deployment via .env. Keep false in production.
  ENABLE_RESEARCH_MODELS: ${ENABLE_RESEARCH_MODELS:-false}
  # Explicit acknowledgment that running ENABLE_RESEARCH_MODELS=true in production
  # is for academic/non-commercial use only. Required by api/lifespan.py to start
  # in production with research models enabled (otherwise it refuses to boot to
  # prevent licensing violations). Default empty/false.
  RESEARCH_MODELS_NONCOMMERCIAL_ACK: ${RESEARCH_MODELS_NONCOMMERCIAL_ACK:-false}

services:
  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Require a password on the Redis instance so it cannot be accessed
    # without credentials even if the port is accidentally exposed.
    # Enable AOF persistence for durability: flush every second, fsync on background.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --loglevel warning
      --appendonly yes
      --appendfsync everysec
    # SECURITY: Run as non-root user, drop all capabilities
    user: redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    networks:
      - infra_net

  qdrant:
    image: qdrant/qdrant:v1.16.1
    restart: unless-stopped
    # SECURITY: Drop all capabilities, run as non-root (qdrant runs as uid 1000)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # QDRANT__SERVICE__API_KEY is Qdrant's native API key env var.
      # Production deployments MUST set QDRANT_API_KEY in .env to enforce auth.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    networks:
      - infra_net

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c idle_in_transaction_session_timeout=30000
      -c data_directory=/var/lib/postgresql/data
      -c fsync=on
      -c synchronous_commit=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-forensic_council}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256 --auth-local=scram-sha-256
    # SECURITY: Run as non-root (postgres), drop unnecessary capabilities
    user: postgres
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensic_user} -d ${POSTGRES_DB:-forensic_council}"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 768m
    mem_reservation: 192m
    cpus: 1.0
    networks:
      - infra_net

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    restart: unless-stopped
    # Port 16686 (Jaeger UI) NOT exposed at base level — binding lives in
    # docker-compose.dev.yml. Running base compose alone would otherwise expose
    # the unauthenticated Jaeger UI publicly.
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 384m
    mem_reservation: 64m
    cpus: 0.5
    networks:
      - infra_net

  migration:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: migration
    restart: on-failure
    # Run alembic migrations THEN seed data. Do NOT drop this to just init_db.py —
    # that silently bypasses schema migrations (P0-DOCKER-001 fix, audit v6→v7).
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/init_db.py"]
    # SECURITY: Run with minimal privileges
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-forensic_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-forensic_council}
      - SIGNING_KEY=${SIGNING_KEY:?SIGNING_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set}
      - BOOTSTRAP_INVESTIGATOR_PASSWORD=${BOOTSTRAP_INVESTIGATOR_PASSWORD:?BOOTSTRAP_INVESTIGATOR_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra_net
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5

  # --------------------------------------------------------------------------
  # Backend API
  # --------------------------------------------------------------------------
  backend:
    # Backend and worker run the SAME image (identical Dockerfile target + build
    # args) and differ only by runtime command (default API vs `worker`). Pinning
    # an explicit shared image tag makes compose build it once and guarantees the
    # two can never drift into separate multi-GB images.
    image: forensic-council-api:dev
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: development
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-0}
        YOLO_MODEL_NAME: ${YOLO_MODEL_NAME:-detr-resnet-50}
        AASIST_MODEL_NAME: ${AASIST_MODEL_NAME:-Vansh180/deepfake-audio-wav2vec2}
    restart: unless-stopped
    # Port 8000 intentionally NOT exposed at base level — host binding lives in
    # infra/docker-compose.dev.yml so default `docker compose up` routes through
    # Caddy (CSP/CORS/rate limits). (P1-DOCKER-002 fix, audit v6→v7)
    environment:
      <<: *backend-env
      APP_NAME: forensic_council
      API_HOST: 0.0.0.0
      API_PORT: 8000
      BOOTSTRAP_INVESTIGATOR_PASSWORD: ${BOOTSTRAP_INVESTIGATOR_PASSWORD}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: forensic_api
      GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS: ${GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS:-120}
      RELOAD: "true"
      LOG_FORMAT: "console"
      # Allow first-run startup fallback if PRELOAD_MODELS=0 or a seed cache is
      # missing. Set SKIP_MODEL_DOWNLOAD=1 explicitly for CI smoke builds.
      SKIP_MODEL_DOWNLOAD: ${SKIP_MODEL_DOWNLOAD:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/live || exit 1"]
      # One-minute probing is sufficient for this stable proxy and reduces
      # long-running Docker Desktop healthcheck exec churn.
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 120s
    mem_limit: 2560m
    mem_reservation: 768m
    cpus: 2.0
    # SECURITY: Run with minimal privileges, no new privileges, read-only filesystem
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    stop_grace_period: 300s
    volumes:
      # Source code bind mounts — uvicorn --reload picks up changes instantly.
      # Individual subdirectories are mounted so .venv (and /app/storage) are NOT
      # shadowed; the container keeps the Python packages baked into the image.
      - ../apps/api/core:/app/core:ro,consistent
      - ../apps/api/api:/app/api:ro,consistent
      - ../apps/api/agents:/app/agents:ro,consistent
      - ../apps/api/tools:/app/tools:ro,consistent
      - ../apps/api/orchestration:/app/orchestration:ro,consistent
      - ../apps/api/scripts:/app/scripts:ro,consistent
      - ../apps/api/config:/app/config:ro,consistent
      - ../apps/api/alembic:/app/alembic:ro,consistent
      - ../apps/api/alembic.ini:/app/alembic.ini:ro,consistent
      # Runtime data volumes
      # signing_keys is read-write here: the backend (arbiter) is the only service
      # that signs reports. The worker mounts the same volume read-only.
      - evidence_data:/app/storage/evidence:rw
      - signing_keys:/app/storage/keys:rw
      - backups_data:/app/storage/backups:rw
      - hf_cache:/app/cache/huggingface:rw
      - torch_cache:/app/cache/torch:rw
      - easyocr_cache:/app/cache/easyocr:rw
      - numba_cache:/app/cache/numba_cache:rw
      - yolo_cache:/app/cache/ultralytics:rw
      - calibration_models_cache:/app/cache/calibration_models:rw
      - trufor_cache:/app/cache/trufor:rw
    # SECURITY: infra_net for Redis/Postgres/Qdrant; external_net for Groq/Gemini outbound;
    # backend_net so Caddy and frontend can resolve and proxy to backend:8000
    networks:
      - infra_net
      - external_net
      - backend_net

  # --------------------------------------------------------------------------
  # Forensic Worker — consumes and processes the task queue
  # --------------------------------------------------------------------------
  worker:
    # Shares the backend image (see backend.image note). Same build, different
    # command — compose builds forensic-council-api:dev once and reuses it here.
    image: forensic-council-api:dev
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: development
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-0}
        YOLO_MODEL_NAME: ${YOLO_MODEL_NAME:-detr-resnet-50}
        AASIST_MODEL_NAME: ${AASIST_MODEL_NAME:-Vansh180/deepfake-audio-wav2vec2}
    restart: unless-stopped
    # I-H-7: long grace so SIGTERM lets the worker drain mid-pipeline
    # investigations (audio/video forensics can take minutes). Without
    # this Docker defaults to 10 s and SIGKILLs through a running
    # pipeline, leaving Redis queue entries half-processed and
    # chain-of-custody fragments orphaned.
    stop_grace_period: 300s
    command: ["worker"]
    environment:
      <<: *backend-env
      APP_NAME: forensic_worker
      RELOAD: "true"
      LOG_FORMAT: "console"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: forensic_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/scripts/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      # Source code bind mounts — restart the worker to pick up changes instantly.
      - ../apps/api/core:/app/core:ro,consistent
      - ../apps/api/api:/app/api:ro,consistent
      - ../apps/api/agents:/app/agents:ro,consistent
      - ../apps/api/tools:/app/tools:ro,consistent
      - ../apps/api/orchestration:/app/orchestration:ro,consistent
      - ../apps/api/scripts:/app/scripts:ro,consistent
      - ../apps/api/config:/app/config:ro,consistent
      - ../apps/api/alembic:/app/alembic:ro,consistent
      - ../apps/api/alembic.ini:/app/alembic.ini:ro,consistent
      # Runtime data volumes
      # Note: Worker runs investigations but does NOT sign reports - arbiter (in backend service) signs.
      # signing_keys is therefore mounted read-only; backend has read-write access for signing.
      - evidence_data:/app/storage/evidence:rw
      - signing_keys:/app/storage/keys:ro
      - backups_data:/app/storage/backups:rw
      - hf_cache:/app/cache/huggingface:rw
      - torch_cache:/app/cache/torch:rw
      - easyocr_cache:/app/cache/easyocr:rw
      - numba_cache:/app/cache/numba_cache:rw
      - yolo_cache:/app/cache/ultralytics:rw
      - calibration_models_cache:/app/cache/calibration_models:rw
      - trufor_cache:/app/cache/trufor:rw
    mem_limit: 6g
    mem_reservation: 3g
    cpus: 4.0
    networks:
      - infra_net
      - external_net
      - backend_net

  # --------------------------------------------------------------------------
  # Reverse Proxy (Caddy) — TLS termination, security headers, rate limiting
  # --------------------------------------------------------------------------
  # Caddy is the same-origin entry point for both local and production runs.
  # Local dev can also use ports 3000/8000 directly.
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CADDY_SITE_ADDRESS=${CADDY_SITE_ADDRESS:-http://localhost}
      # Suppress quic-go UDP buffer warning — net.core.rmem_max can't be set
      # per-container on Docker Desktop / WSL2 without host kernel changes.
      - QUIC_GO_DISABLE_RECEIVE_BUFFER_WARNING=1
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      # Worker must be healthy before Caddy routes public traffic so that
      # all analytical agents are fully loaded when the first investigation arrives.
      worker:
        condition: service_healthy
    healthcheck:
      # NOTE: do NOT pipe wget into head — a pipeline's exit code is the last
      # command's, so `wget … | head -1` always exits 0 and the check can never
      # fail. The check must propagate wget's own exit status.
      # Probe over HTTPS so the check survives CADDY_SITE_ADDRESS=https://… (the
      # HTTP port then 308-redirects into TLS; a plain http probe would follow the
      # redirect, fail the self-signed handshake, and report unhealthy even though
      # the site is serving). --no-check-certificate accepts the internal CA cert.
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/lb-health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # SECURITY: Run with minimal privileges
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Required to bind ports 80/443
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    # SECURITY: Can reach frontend and backend only
    networks:
      - frontend_net
      - backend_net

  # --------------------------------------------------------------------------
  # Frontend
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
      # NOTE: dev target. prod overlay flips this to `runner` (see docker-compose.prod.yml).
      # If you forget the prod overlay, a banner is logged at container start.
      args:
        # Only NEXT_PUBLIC_API_URL is a build-time arg (baked into the bundle by
        # the web Dockerfile's `ARG NEXT_PUBLIC_API_URL`). INTERNAL_API_URL is a
        # SERVER-SIDE runtime var read by the Next.js API routes — it is provided
        # via `environment:` below, never baked, so it is intentionally not a
        # build arg (the Dockerfile declares no ARG for it).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    # Port 3000 intentionally NOT exposed at base level — the host binding lives
    # in infra/docker-compose.dev.yml so the base/prod stacks route all frontend
    # traffic through Caddy. This mirrors the backend (its 8000 binding is also
    # dev-overlay-only) and avoids a duplicate port mapping when overlays merge.
    volumes:
      - ../apps/web:/app/apps/web:rw
      - web_next:/app/apps/web/.next
      - web_node_modules:/app/apps/web/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - RUNNING_IN_DOCKER=1
      # Standalone Next.js server must bind to all interfaces so health-checks
      # and external traffic can reach it from outside the container.
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Next.js 15 uses Turbopack by default. WATCHPACK_POLLING/CHOKIDAR vars are
      # webpack-only and have been removed — Turbopack manages its own file watcher.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
      # DEMO_PASSWORD must be explicitly set and MUST equal BOOTSTRAP_INVESTIGATOR_PASSWORD.
      # No silent default — an unset value is caught early (P0-FE-001 fix, audit v6→v7).
      - DEMO_PASSWORD=${DEMO_PASSWORD:?DEMO_PASSWORD must be set and equal BOOTSTRAP_INVESTIGATOR_PASSWORD}
      - BOOTSTRAP_INVESTIGATOR_PASSWORD=${BOOTSTRAP_INVESTIGATOR_PASSWORD:-}
      # INTERNAL_API_URL: used by Next.js server-side API routes (e.g. /api/auth/demo).
      # Inside Docker, the frontend container CANNOT reach "localhost:8000" — it must
      # use the Docker-internal service name "backend".
      - INTERNAL_API_URL=http://backend:8000
      - DISABLE_NEXT_API_PROXY=${DISABLE_NEXT_API_PROXY:-}
    command: ["npm", "run", "dev"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 60s
    # SECURITY: no-new-privileges + drop all caps. NOTE: the `development` target
    # runs as root (only the `runner`/prod target switches to the 'nextjs' user),
    # which is acceptable for the local dev stack but never for production.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    mem_reservation: 384m
    cpus: 2.0
    # SECURITY: Frontend can only reach backend, NOT infrastructure services
    networks:
      - frontend_net
      - backend_net

  # --------------------------------------------------------------------------
  # Observability — Prometheus metrics scraping
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro  # WS-6 #30 alert rules
      - prometheus_data:/prometheus
    secrets:
      - source: metrics_scrape_token
        target: metrics_scrape_token
    # Port 9090 NOT exposed at base level — binding lives in docker-compose.dev.yml.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    mem_reservation: 96m
    cpus: 0.5
    # Prometheus only needs backend_net to scrape backend:8000/api/v1/metrics/raw
    networks:
      - backend_net

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
  evidence_data:
  signing_keys:
  backups_data:
  hf_cache:
  torch_cache:
  easyocr_cache:
  numba_cache:
  yolo_cache:
  calibration_models_cache:
  trufor_cache:  # TruFor splicing model weights (~281MB), gated on ENABLE_RESEARCH_MODELS
  caddy_data:
  caddy_config:
  caddy_logs:
  prometheus_data:
  web_next:
  web_node_modules:

# ── Network Segmentation ───────────────────────────────────────────────────────
# SECURITY: Four-network isolation model:
# - infra_net (internal):  Redis, Postgres, Qdrant — no internet, no frontend access
# - external_net:          Backend + Worker outbound only (Groq, Gemini API calls)
# - backend_net:           Caddy ↔ Backend, Frontend ↔ Backend
# - frontend_net:          Caddy ↔ Frontend only
# Backend/Worker join infra_net + external_net + backend_net.
# Infra services (Redis/Postgres/Qdrant) are on infra_net only — no outbound.
networks:
  infra_net:
    driver: bridge
    internal: true   # No outbound internet — infra services don't need it
  external_net:
    driver: bridge
    internal: false  # Backend/Worker outbound for Groq, Gemini external APIs
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

secrets:
  metrics_scrape_token:
    environment: METRICS_SCRAPE_TOKEN
